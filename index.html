<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="theme-color" content="#1b0f3b">
<title>شلة الجودة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#1b0f3b;--bg2:#3d1166;--card:#2a1a55;--card2:#3a2672;--text:#fff7ea;--muted:#cbbcff;
  --pri:#ffcc00;--pri-ink:#2a1300;--pink:#ff4fa3;--cyan:#30e3ca;--green:#4ade80;--red:#ff5d5d;
  --line:rgba(255,255,255,.14);--shadow:0 8px 0 rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#1b0f3b;--bg2:#3d1166;--card:#2a1a55;--text:#fff7ea}}
:root[data-theme="dark"]{--bg1:#1b0f3b;--bg2:#3d1166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:#1b0f3b;overflow-x:hidden}
body{min-height:100dvh;color:var(--text);font-family:'Cairo',system-ui,sans-serif;
  background:radial-gradient(circle at 20% 10%,rgba(255,79,163,.25),transparent 40%),radial-gradient(circle at 85% 90%,rgba(48,227,202,.18),transparent 45%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;overflow-x:hidden;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
#app{max-width:520px;margin:0 auto;padding:12px 16px 40px;min-height:100dvh;display:flex;flex-direction:column}
header.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:6px}
.icon-btn{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--text);border-radius:14px;width:44px;height:44px;font-size:20px;cursor:pointer}
.top-title{font-family:'Lalezar',cursive;font-size:22px;letter-spacing:.5px;opacity:.9}
main.screen{flex:1;display:flex;flex-direction:column;gap:14px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:'Lalezar',cursive;font-weight:400;margin:0}
h2{font-size:30px;text-align:center}
h3{font-size:22px}
p{margin:0;line-height:1.7}
.muted{color:var(--muted)}
.center{text-align:center}
.btn{font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;border:0;border-radius:18px;padding:14px 18px;cursor:pointer;
  background:var(--card2);color:var(--text);box-shadow:var(--shadow);transition:transform .08s, box-shadow .08s;width:100%}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.primary{background:var(--pri);color:var(--pri-ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn.cyan{background:var(--cyan);color:#06302a}
.btn.green{background:var(--green);color:#063014}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border:2px dashed var(--line)}
.btn.big{font-size:24px;padding:18px}
.btn.small{font-size:15px;padding:10px 12px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.pill{display:inline-block;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600}

/* home */
.logo{text-align:center;margin:18px 0 8px}
.logo-emoji{font-size:84px;display:inline-block;animation:wobble 2.6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
.logo h1{font-size:64px;line-height:1;background:linear-gradient(90deg,var(--pri),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
.logo .sub{font-family:'Lalezar';font-size:22px;color:var(--pri);margin-top:2px}
.tag{min-height:56px;margin-top:8px;color:var(--muted);font-weight:600}
.floaters{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.floaters span{position:absolute;font-size:30px;opacity:.18;animation:float 14s linear infinite}
@keyframes float{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}

/* players */
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 10px;animation:in .25s}
.av{font-size:30px;width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.1);border:0;cursor:pointer;display:grid;place-items:center;flex:none}
.pname{flex:1;font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pscore{font-weight:800;color:var(--pri)}
.del{background:none;border:0;color:var(--red);font-size:22px;cursor:pointer;padding:6px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:18px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);outline:none}
.addrow input:focus{border-color:var(--pri)}
.addrow .btn{width:auto;flex:none}

/* categories */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 4px;text-align:center;cursor:pointer;font-weight:800;font-size:14px;transition:.15s;position:relative;color:var(--text);font-family:inherit}
.cat .e{font-size:32px;display:block}
.cat.on{border-color:var(--pri);background:linear-gradient(160deg,#5b3a00,#3a2672);transform:scale(1.03)}
.cat.on::after{content:'✓';position:absolute;top:4px;left:8px;color:var(--pri)}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-weight:800;padding:10px 6px;border-radius:12px;cursor:pointer;font-size:15px}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt label{font-weight:800}
.opt small{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center}
.stepper button{width:46px;height:46px;border-radius:14px;border:0;background:var(--card2);color:var(--text);font-size:24px;font-weight:800;cursor:pointer}
.stepper b{font-size:28px;min-width:40px;text-align:center}

/* reveal card */
.pass{text-align:center}
.pass .bigav{font-size:90px;animation:bounce 1.2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.flip{perspective:1200px;height:360px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.6,.5,1);transform-style:preserve-3d}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.3)}
.face.back{background:repeating-linear-gradient(45deg,#ff4fa3 0 20px,#e03b8c 20px 40px);font-family:'Lalezar';font-size:30px}
.face.back .q{font-size:110px;line-height:1}
.face.front{transform:rotateY(180deg);background:linear-gradient(160deg,#fff7ea,#ffe08a);color:#2a1300}
.face.front.out{background:linear-gradient(160deg,#ff5d5d,#a3164f);color:#fff}
.face .word{font-family:'Lalezar';font-size:52px;line-height:1.1}
.face .emo{font-size:76px}

/* questions */
.qpair{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.qp{text-align:center;width:120px}
.qp .a{font-size:62px}
.qp .n{font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{font-size:40px;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.hint{background:rgba(255,204,0,.12);border:2px dashed var(--pri);border-radius:18px;padding:12px;text-align:center;font-weight:700}
.ring{position:relative;width:120px;height:120px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;font-family:'Lalezar'}
.ring.warn b{color:var(--red);animation:pulse .5s infinite}
.progress{height:10px;border-radius:9px;background:rgba(0,0,0,.3);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pri));transition:width .3s}

/* voting */
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vbtn{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;color:var(--text);font:inherit;font-weight:800;font-size:17px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.vbtn .a{font-size:44px}
.vbtn:active,.vbtn.on{border-color:var(--pink);background:#4a1f5e}
.bar{display:flex;align-items:center;gap:8px}
.bar .n{width:110px;font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .t{flex:1;height:26px;background:rgba(0,0,0,.3);border-radius:10px;overflow:hidden}
.bar .t i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pri));border-radius:10px;transition:width 1s cubic-bezier(.2,1.4,.4,1)}
.bar .c{width:28px;text-align:center;font-weight:800}
.drum{font-size:110px;text-align:center;animation:shake .15s infinite}
@keyframes shake{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}100%{transform:rotate(-6deg)}}
.unmask{text-align:center}
.unmask .who{font-size:120px;animation:pop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.verdict{font-family:'Lalezar';font-size:34px;line-height:1.3}
.verdict.good{color:var(--green)}.verdict.bad{color:var(--red)}

/* guess */
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbtn{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 4px;color:var(--text);font:inherit;font-weight:800;font-size:15px;cursor:pointer;min-height:64px}
.gbtn.right{background:var(--green);color:#063014;border-color:#fff}
.gbtn.wrong{background:var(--red);color:#fff}
.gbtn[disabled]{cursor:default}

/* results */
.lb{display:flex;flex-direction:column;gap:6px}
.lbi{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:8px 12px;border:1px solid var(--line)}
.lbi .r{font-family:'Lalezar';font-size:22px;width:30px;text-align:center}
.lbi .a{font-size:30px}
.lbi .n{flex:1;font-weight:800}
.lbi .d{font-weight:800;color:var(--green);font-size:14px;direction:ltr;unicode-bidi:isolate}
.mgrid .mini:last-child:nth-child(odd){grid-column:1/-1}
.lbi .s{font-family:'Lalezar';font-size:24px;color:var(--pri)}
.lbi.first{background:linear-gradient(90deg,#6b4a00,var(--card));border-color:var(--pri)}
.secret{text-align:center;background:linear-gradient(160deg,#fff7ea,#ffe08a);color:#2a1300;border-radius:22px;padding:14px}
.secret .word{font-family:'Lalezar';font-size:40px}

/* minis */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{border:0;border-radius:24px;padding:18px 10px;color:#fff;font:inherit;cursor:pointer;text-align:center;box-shadow:var(--shadow)}
.mini .e{font-size:50px;display:block}
.mini b{font-family:'Lalezar';font-size:24px;font-weight:400;display:block}
.mini small{opacity:.9;font-weight:600}
.wheelwrap{position:relative;width:min(340px,86vw);margin:0 auto}
.wheelwrap canvas{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 0 rgba(0,0,0,.3))}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:44px;z-index:2;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.bigcard{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;font-size:24px;font-weight:800;line-height:1.6}
.count{font-family:'Lalezar';font-size:150px;text-align:center;line-height:1;animation:pop .4s}
.charword{font-family:'Lalezar';font-size:56px;text-align:center;line-height:1.2;min-height:140px;display:grid;place-items:center;background:linear-gradient(160deg,#fff7ea,#ffe08a);color:#2a1300;border-radius:26px;padding:10px}

/* modal/toast */
.overlay{position:fixed;inset:0;background:rgba(10,4,30,.75);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50;padding:16px;animation:in .2s}
.modal{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px;max-height:90dvh;overflow:auto}
.modal textarea,.modal input{font:inherit;font-weight:600;font-size:16px;padding:12px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);width:100%;outline:none}
.modal textarea{min-height:120px;resize:vertical}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--pri);color:var(--pri-ink);font-weight:800;padding:12px 20px;border-radius:99px;z-index:60;box-shadow:var(--shadow);animation:toast 2.6s forwards;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,30px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,30px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.rules li{margin-bottom:8px;line-height:1.7}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700}
.stat:last-child{border:0}
.badge{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.06);border-radius:16px;padding:10px;font-weight:700}
.badge .e{font-size:34px}
.toggle{display:flex;justify-content:space-between;align-items:center;font-weight:800;padding:6px 0}
.sw{width:58px;height:32px;border-radius:99px;background:rgba(0,0,0,.35);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}
.sw.on::after{right:30px}
/* slot + podium */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pc{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;transition:transform .08s,border-color .08s,background .08s;min-width:0}
.pc .a{font-size:40px;line-height:1.2}
.pc .n{font-weight:800;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc.hl{border-color:var(--pri);background:linear-gradient(160deg,#5b3a00,var(--card));transform:scale(1.1)}
.pc.hid{animation:popS .4s}
.reels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:4px;min-height:96px;justify-content:center;overflow:hidden}
.reel small{color:var(--muted);font-weight:700}
.reel b{font-family:'Lalezar';font-weight:400;font-size:22px;line-height:1.3;filter:blur(1.5px);opacity:.75}
.reel.stop{border-color:var(--pri);background:linear-gradient(160deg,#5b3a00,var(--card));animation:popS .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes popS{from{transform:scale(.3)}to{transform:scale(1)}}
.reel.stop b{filter:none;opacity:1}
.twist{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;border:2px solid var(--pink);animation:popS .5s cubic-bezier(.3,1.8,.5,1)}
.twist .e{font-size:60px;line-height:1}
.twistpill{align-self:center;background:rgba(255,79,163,.18);border-color:var(--pink)}
.slotico{font-size:70px;text-align:center;animation:shake .25s infinite}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:10px}
.pod{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pod .a{font-size:50px;animation:bounce 1.4s infinite}
.pod .n{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .st{width:100%;border-radius:16px 16px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;font-size:30px;box-shadow:var(--shadow)}
.pod .st b{font-family:'Lalezar';font-weight:400;font-size:28px;color:var(--pri-ink)}
.pod.p0 .st{height:130px;background:linear-gradient(#d9d9e3,#9a9ab0)}
.pod.p1 .st{height:175px;background:linear-gradient(var(--pri),#c27a00)}
.pod.p1 .a{font-size:66px}
.pod.p2 .st{height:105px;background:linear-gradient(#e8a46a,#a0592a)}
.rk{font-size:13px;font-weight:700;color:var(--muted)}
/* hub + new games */
.feature{display:flex;align-items:center;gap:12px;border:0;border-radius:26px;padding:16px 18px;background:linear-gradient(135deg,var(--pri),#ff8a3d);color:var(--pri-ink);box-shadow:var(--shadow);cursor:pointer;font:inherit;text-align:right;width:100%}
.feature:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.feature .e{font-size:58px;animation:wobble 2.6s ease-in-out infinite;flex:none}
.feature b{font-family:'Lalezar';font-size:32px;font-weight:400;display:block;line-height:1.2}
.feature small{font-weight:700;opacity:.85;display:block}
.feature .go{margin-right:auto;font-size:26px;flex:none}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.row4 .btn{padding:10px 4px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.cc{justify-content:center}
.chip{border:2px solid var(--line);background:rgba(0,0,0,.2);color:var(--text);border-radius:99px;padding:6px 14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.bigletter{font-family:'Lalezar';font-size:140px;line-height:1;background:linear-gradient(160deg,#fff7ea,#ffe08a);color:#2a1300;border-radius:34px;width:200px;height:200px;margin:0 auto;display:grid;place-items:center;box-shadow:var(--shadow)}
.bigletter.stop{animation:popS .5s cubic-bezier(.3,1.8,.5,1)}
.bigletter.small{width:120px;height:120px;font-size:84px;border-radius:26px}
.stepper.sm{gap:8px;flex:none}
.stepper.sm button{width:38px;height:38px;font-size:20px;border-radius:12px}
.stepper.sm b{font-size:20px;min-width:34px}
.pad{width:100%;height:min(92vw,46dvh);max-height:480px;background:#fff7ea;border-radius:20px;touch-action:none;box-shadow:var(--shadow);display:block;cursor:crosshair}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dot{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.2);cursor:pointer;font-size:17px;padding:0;display:grid;place-items:center}
.dot.on{border-color:#fff;transform:scale(1.15)}
.dot.tool{background:var(--card2);color:var(--text)}
#peek{-webkit-touch-callout:none;touch-action:none}
.drawimg{width:100%;border-radius:20px;box-shadow:var(--shadow);background:#fff7ea}
.role-list .lbi .n small{display:block;color:var(--muted);font-weight:700}
.dead{opacity:.5;text-decoration:line-through}
@media (max-width:360px){.cgrid{grid-template-columns:repeat(2,1fr)}.ggrid{grid-template-columns:repeat(2,1fr)}.logo h1{font-size:56px}}
</style>
</head>
<body>
<div class="floaters" aria-hidden="true"></div>
<div id="app"></div>
<canvas id="fx"></canvas>

<script>
/* ============================ DATA ============================ */

const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxRaf=0;
function sizeFx(){fx.width=innerWidth*devicePixelRatio;fx.height=innerHeight*devicePixelRatio}
addEventListener('resize',sizeFx);sizeFx();
function confetti(n=140,emojis){const W=fx.width,H=fx.height;const cols=['#ffcc00','#ff4fa3','#30e3ca','#4ade80','#fff','#a78bfa'];
 for(let i=0;i<n;i++)parts.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.45,vx:(Math.random()-.5)*26*devicePixelRatio,vy:(-Math.random()*26-8)*devicePixelRatio,g:.7*devicePixelRatio,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,s:(6+Math.random()*8)*devicePixelRatio,c:rnd(cols),e:emojis?rnd(emojis):null,l:0});
 if(!fxRaf)fxLoop()}
function fxLoop(){fctx.clearRect(0,0,fx.width,fx.height);parts.forEach(p=>{p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l++;fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.r);if(p.e){fctx.font=`${p.s*3}px serif`;fctx.fillText(p.e,0,0)}else{fctx.fillStyle=p.c;fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}fctx.restore()});
 parts=parts.filter(p=>p.y<fx.height+60&&p.l<400);if(parts.length)fxRaf=requestAnimationFrame(fxLoop);else{fxRaf=0;fctx.clearRect(0,0,fx.width,fx.height)}}
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2700)}
function modal(html){closeModal();const o=document.createElement('div');o.className='overlay';o.id='ov';o.innerHTML=`<div class="modal">${html}</div>`;o.addEventListener('click',e=>{if(e.target===o)closeModal()});document.body.appendChild(o)}
function closeModal(){const o=$('#ov');if(o)o.remove()}
(function floaters(){const f=$('.floaters');const em=['🤡','🤫','👀','😂','🎭','❓','🥸','🙊'];let h='';for(let i=0;i<12;i++)h+=`<span style="left:${Math.random()*100}%;animation-delay:-${Math.random()*14}s;animation-duration:${10+Math.random()*10}s">${rnd(em)}</span>`;f.innerHTML=h})();

M.wheel=()=>{TMP.spinning=false;TMP.rot=TMP.rot||0;drawWheel(TMP.rot);try{document.fonts&&document.fonts.ready.then(()=>{if(screen==='wheel'&&!TMP.spinning)drawWheel(TMP.rot)})}catch(e){}};
function drawWheel(rot){const c=$('#wh');if(!c)return;const x=c.getContext('2d'),W=c.width,r=W/2-10,n=PENALTIES.length,seg=Math.PI*2/n;const cols=['#ff4fa3','#ffcc00','#30e3ca','#8b5cf6','#4ade80','#ff8a3d'];
 x.clearRect(0,0,W,W);x.save();x.translate(W/2,W/2);
 for(let i=0;i<n;i++){const a0=rot+i*seg;x.beginPath();x.moveTo(0,0);x.arc(0,0,r,a0,a0+seg);x.closePath();x.fillStyle=cols[i%cols.length];x.fill();x.strokeStyle='#1b0f3b';x.lineWidth=5;x.stroke();
  const mid=a0+seg/2,flip=Math.cos(mid)<0;x.save();x.rotate(flip?mid+Math.PI:mid);x.textBaseline='middle';x.textAlign=flip?'left':'right';const sg=flip?-1:1;
  x.font='44px serif';x.fillText(PENALTIES[i].e,sg*(r-18),0);x.font='800 28px Cairo, sans-serif';x.fillStyle='#1b0f3b';x.fillText(PENALTIES[i].s,sg*(r-80),2);x.restore()}
 x.beginPath();x.arc(0,0,52,0,Math.PI*2);x.fillStyle='#1b0f3b';x.fill();x.font='54px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('😈',0,4);x.restore()}

const SESS={};
function sAdd(game,id,n,life){SESS[game]=SESS[game]||{};SESS[game][id]=(SESS[game][id]||0)+n;const p=pById(id);if(p&&life)p.score+=life}
function sBoard(game,deltas){const sc=SESS[game]||{};const ps=players.slice().sort((a,b)=>(sc[b.id]||0)-(sc[a.id]||0));
 return `<div class="lb">${ps.map((p,i)=>{const top=i===0&&sc[p.id];return `<div class="lbi ${top?'first':''}"><span class="r">${top?'👑':i+1}</span><span class="a">${p.av}</span><span class="n">${esc(p.name)}</span>${deltas&&deltas[p.id]?`<span class="d">+${deltas[p.id]}</span>`:''}<span class="s">${sc[p.id]||0}</span></div>`}).join('')}</div>`}
const ringH=n=>`<div class="ring" id="ring"><svg width="120" height="120"><circle cx="60" cy="60" r="52" stroke="rgba(0,0,0,.3)" stroke-width="12" fill="none"/><circle id="rc" cx="60" cy="60" r="52" stroke="#30e3ca" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0" style="transition:stroke-dashoffset 1s linear, stroke .3s"/></svg><b id="rt">${n}</b></div>`;
function ringTimer(total,onEnd){let left=total;I(()=>{left--;if(left<0)return;const rc=$('#rc'),rt=$('#rt'),ring=$('#ring');if(!rt)return;rt.textContent=left;rc.style.strokeDashoffset=326.7*(1-left/total);
 if(left<=5&&left>0){sfx('tick');ring.classList.add('warn');rc.style.stroke='#ff5d5d'}if(left===0){sfx('buzz');vib([200,100,200]);rt.textContent='⏰';onEnd&&onEnd()}},1000)}
const drumH=(e,t)=>`<div style="margin:auto 0;display:flex;flex-direction:column;gap:16px"><div class="drum">${e}</div><h2>${t}</h2></div>`;
const passH=(p,title,sub,count,act,btn)=>`<div class="pass card"><div class="bigav">${p.av}</div><h2>${title}</h2><p class="muted">${sub}</p>${count?`<p class="pill" style="margin-top:8px">${count}</p>`:''}</div><button class="btn big primary" data-a="${act}">${btn}</button>`;
const gridH=(list,act,extra)=>`<div class="vgrid">${list.map(x=>`<button class="vbtn" data-a="${act}" data-v="${x.id}"><span class="a">${x.av}</span>${esc(x.name)}</button>`).join('')}</div>${extra||''}`;
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});

/* ============================ MAFIA ============================ */
const MF=()=>TMP.maf;
const mafMax=()=>Math.max(1,Math.floor((players.length-1)/3));
V.mafSetup=()=>{const o=TMP.mafOpt||(TMP.mafOpt={m:0,d:true,p:true,t:120});if(!o.m)o.m=Math.max(1,Math.floor(players.length/4));o.m=Math.min(o.m,mafMax());
 return `<h2>🔪 المافيا</h2>
 <div class="card"><p>كل واحد ياخذ دور سري. بالليل المافيا تقتل، والطبيب يحمي، والمحقق يحقق. بالنهار الكل يتناقش ويصوّت منو يعدمون. <b>التلفون هو الراوي!</b> 🎙️</p></div>
 <div class="card opt"><label>🔪 عدد المافيا</label><div class="stepper"><button data-a="mafM" data-v="-1">−</button><b>${o.m}</b><button data-a="mafM" data-v="1">+</button></div><small class="center">${players.length} لاعبين • الحد الأعلى ${mafMax()}</small></div>
 <div class="card"><div class="toggle"><span>💉 الطبيب</span><button class="sw ${o.d?'on':''}" data-a="mafT" data-v="d"></button></div><div class="toggle"><span>🕵️ المحقق</span><button class="sw ${o.p?'on':''}" data-a="mafT" data-v="p"></button></div></div>
 <div class="card opt"><label>⏱️ وقت النقاش بالنهار</label><div class="seg">${[[60,'دقيقة'],[120,'دقيقتين'],[180,'٣ دقايق'],[0,'بلا']].map(([v,l])=>`<button class="${o.t===v?'on':''}" data-a="mafTime" data-v="${v}">${l}</button>`).join('')}</div></div>
 <button class="btn big primary" data-a="mafStart">🎭 وزّع الأدوار</button>`};
A.mafM=d=>{const o=TMP.mafOpt;o.m=Math.min(mafMax(),Math.max(1,o.m+(+d)));render()};
A.mafT=k=>{TMP.mafOpt[k]=!TMP.mafOpt[k];render()};
A.mafTime=v=>{TMP.mafOpt.t=+v;render()};
A.mafStart=()=>{if(players.length<5){TMP.after='mafia';go('players');return}const o=TMP.mafOpt;const ids=shuffle(players.map(p=>p.id));const roles={};let i=0;
 for(;i<o.m;i++)roles[ids[i]]='m';if(o.d)roles[ids[i++]]='d';if(o.p)roles[ids[i++]]='p';for(;i<ids.length;i++)roles[ids[i]]='c';
 TMP.maf={roles,order0:players.map(p=>p.id),alive:players.map(p=>p.id),ri:0,shown:false,night:0};sfx('pop');go('mafRole')};
V.mafRole=()=>{const m=MF();const p=pById(m.order0[m.ri]);
 if(!m.shown)return `<div class="pass card"><div class="bigav">${p.av}</div><h2>مرّر الجهاز لـ ${esc(p.name)}</h2><p class="muted">دورك سرّي للموت 🤫</p><p class="pill" style="margin-top:8px">${m.ri+1} / ${m.order0.length}</p></div>
 <div class="flip" data-a="mafFlip"><div class="flip-inner"><div class="face back"><span class="q">🎭</span>اضغط وشوف دورك</div><div class="face front"></div></div></div>`;
 const r=m.roles[p.id],ro=ROLE[r];const mates=r==='m'?Object.keys(m.roles).filter(x=>m.roles[x]==='m'&&x!==p.id).map(pById):[];
 return `<div class="center"><h3>${pTag(p)}</h3></div>
 <div class="flip on"><div class="flip-inner"><div class="face back"></div><div class="face front ${r==='m'?'out':''}"><span class="emo">${ro.e}</span><div class="word">${ro.n}</div><p>${ro.d}</p>${mates.length?`<p>🤝 زملاءك: <b>${mates.map(x=>esc(x.name)).join('، ')}</b></p>`:''}</div></div></div>
 <button class="btn big primary" data-a="mafRoleNext">🙈 خبّيته، ${m.ri+1<m.order0.length?'التالي':'يلا يبدي الليل 🌙'}</button>`};
A.mafFlip=()=>{const m=MF();if(m.shown)return;m.shown=true;sfx('flip');vib(40);render()};
A.mafRoleNext=()=>{const m=MF();m.shown=false;m.ri++;if(m.ri>=m.order0.length)mafNight();else render()};
function mafNight(){const m=MF();m.night++;m.order=m.order0.filter(id=>m.alive.includes(id));m.idx=0;m.ready=false;m.mv={};m.save=null;m.check=null;go('mafNight')}
V.mafNight=()=>{const m=MF();const p=pById(m.order[m.idx]);const r=m.roles[p.id];const alive=m.alive.map(pById);
 if(!m.ready)return `<div class="center" style="font-size:70px">🌙</div><h2>الليلة ${m.night}</h2>`+passH(p,`مرّر الجهاز لـ ${esc(p.name)}`,'الكل يغمّض عيونه... حتى اللي ما عنده دور 😴',`${m.idx+1} / ${m.order.length}`,'mafReady',`أنا ${esc(p.name)} 🫡`);
 if(m.check){const c=pById(m.check),bad=m.roles[m.check]==='m';return `<h2>🕵️ نتيجة التحقيق</h2><div class="card center"><div style="font-size:70px">${c.av}</div><h3>${esc(c.name)}</h3><div class="verdict ${bad?'bad':'good'}">${bad?'🔪 مافيا!':'😇 بريء'}</div><p class="muted">احفظها براسك وسوّي نفسك ما تدري 🤐</p></div><button class="btn big primary" data-a="mafNext">تمام، خبّي ⬅️</button>`}
 if(r==='m'){const picks=Object.entries(m.mv).map(([v,t])=>`${esc(pById(v).name)} ← ${esc(pById(t).name)}`);return `<h2>🔪 اختار الضحية</h2>${picks.length?`<p class="center muted">زملاءك اختاروا: ${picks.join(' • ')}</p>`:''}`+gridH(alive.filter(x=>m.roles[x.id]!=='m'),'mafAct')}
 if(r==='d')return `<h2>💉 منو تحمي الليلة؟</h2>`+gridH(alive,'mafAct');
 if(r==='p')return `<h2>🕵️ منو تحقق بيه؟</h2>`+gridH(alive.filter(x=>x.id!==p.id),'mafAct');
 return `<h2>😴 انت نايم...</h2><p class="center muted">${rnd(MAF_SLEEP)} — اضغط على أي واحد حتى محد يشك بيك</p>`+gridH(alive.filter(x=>x.id!==p.id),'mafAct')};
A.mafReady=()=>{MF().ready=true;render()};
A.mafAct=id=>{const m=MF();const me=m.order[m.idx];const r=m.roles[me];sfx('pop');vib(30);
 if(r==='m')m.mv[me]=id;else if(r==='d')m.save=id;else if(r==='p'){m.check=id;render();return}
 A.mafNext()};
A.mafNext=()=>{const m=MF();m.check=null;m.idx++;m.ready=false;if(m.idx<m.order.length){render();return}
 const t={};Object.values(m.mv).forEach(x=>t[x]=(t[x]||0)+1);const max=Math.max(0,...Object.values(t));const victim=max?rnd(Object.keys(t).filter(x=>t[x]===max)):null;
 m.killed=null;m.saved=false;if(victim){if(m.save===victim)m.saved=true;else{m.killed=victim;m.alive=m.alive.filter(x=>x!==victim)}}
 m.mShown=false;go('mafMorning')};
function mafWinner(){const m=MF();const ma=m.alive.filter(x=>m.roles[x]==='m').length;const town=m.alive.length-ma;if(!ma)return 'town';if(ma>=town)return 'mafia';return null}
const roleTxt=id=>{const r=ROLE[MF().roles[id]];return `${r.e} ${r.n}`};
V.mafMorning=()=>{const m=MF();if(!m.mShown)return drumH('🌅','طلع الصبح... شنو صار بالليل؟');
 const k=m.killed?pById(m.killed):null;const w=mafWinner();
 return `<div class="unmask card">${k?`<div class="who">💀</div><h2>${esc(k.name)} انقتل!</h2><p>${rnd(MAF_DEATH)}</p><p class="muted">كان دوره: ${roleTxt(k.id)}</p>`:m.saved?`<div class="who">💉</div><h2>الطبيب أنقذ الضحية!</h2><p>محد مات الليلة 🎉</p>`:`<div class="who">😴</div><h2>ليلة هادئة</h2><p>محد مات</p>`}</div>
 ${w?`<button class="btn big pink" data-a="mafFinish">🏁 النتيجة</button>`:`<button class="btn big primary" data-a="go" data-v="mafDay">☀️ نبدي النقاش</button>`}`};
M.mafMorning=()=>{const m=MF();if(!m.mShown){sfx('drum');T(()=>{m.mShown=true;render()},2500)}else if(m.killed){sfx('fail');vib(300)}else{sfx('win');confetti(80,['💉','🎉'])}};
V.mafDay=()=>{const m=MF();const t=TMP.mafOpt.t;const dead=m.order0.filter(x=>!m.alive.includes(x));
 return `<h2>☀️ النهار ${m.night}</h2><p class="center muted">تناقشوا! منو تشكّون بيه؟ 🤔</p>${t?ringH(t):''}
 <div class="pgrid">${m.alive.map(id=>{const p=pById(id);return `<div class="pc"><span class="a">${p.av}</span><span class="n">${esc(p.name)}</span></div>`}).join('')}</div>
 ${dead.length?`<p class="center muted">💀 ماتوا: ${dead.map(x=>esc(pById(x).name)).join('، ')}</p>`:''}
 <button class="btn big pink" data-a="go" data-v="mafVote">⚖️ للتصويت</button>`};
M.mafDay=()=>{const t=TMP.mafOpt.t;if(t)ringTimer(t,()=>toast('خلص وقت النقاش! صوّتوا ⏰'))};
V.mafVote=()=>{const m=MF();return `<h2>⚖️ منو تعدمون؟</h2><p class="center muted">صوّتوا بالأغلبية واضغطوا على اللي اخترتوه</p>`+gridH(m.alive.map(pById),'mafLynch',`<button class="btn ghost" data-a="mafLynch" data-v="">🤷 ما نعدم أحد اليوم</button>`)};
A.mafLynch=id=>{const m=MF();m.lynched=id||null;if(id)m.alive=m.alive.filter(x=>x!==id);m.eShown=false;go('mafElim')};
V.mafElim=()=>{const m=MF();if(!m.eShown)return drumH('⚖️','والحكم...');
 const p=m.lynched?pById(m.lynched):null;const w=mafWinner();const isM=p&&m.roles[p.id]==='m';
 return `<div class="unmask card">${p?`<div class="who">${p.av}</div><h2>${esc(p.name)} انعدم!</h2><div class="verdict ${isM?'good':'bad'}">${isM?'🔪 طلع مافيا! عفية عليكم 👏':'😇 طلع بريء... ظلمتوه 😭'}</div><p class="muted">دوره: ${roleTxt(p.id)}</p>`:`<div class="who">🤷</div><h2>محد انعدم اليوم</h2><p>المافيا مبسوطين بقلوبهم 😏</p>`}</div>
 ${w?`<button class="btn big pink" data-a="mafFinish">🏁 النتيجة</button>`:`<button class="btn big primary" data-a="mafNightGo">🌙 الليلة الجاية</button>`}`};
M.mafElim=()=>{const m=MF();if(!m.eShown){sfx('drum');T(()=>{m.eShown=true;render()},2500)}else if(m.lynched&&m.roles[m.lynched]==='m'){sfx('win');confetti(100,['🔪','👏'])}else if(m.lynched)sfx('fail')};
A.mafNightGo=()=>mafNight();
A.mafFinish=()=>{const m=MF();if(!m.scored){m.scored=true;m.win=mafWinner();Object.keys(m.roles).forEach(id=>{if((m.win==='mafia')===(m.roles[id]==='m'))sAdd('mafia',id,3,2)});save()}go('mafEnd')};
V.mafEnd=()=>{const m=MF();const mw=m.win==='mafia';
 return `<div class="center" style="font-size:90px">${mw?'🔪':'😇'}</div><h2>${mw?'المافيا فازت!':'الشعب انتصر!'}</h2><p class="center muted">${mw?'ضحكوا عليكم واحد واحد 😈':'المافيا انكشفت كلها 👏'}</p>
 <div class="lb role-list">${m.order0.map(id=>{const p=pById(id);const al=m.alive.includes(id);return `<div class="lbi ${(m.roles[id]==='m')===mw?'first':''}"><span class="a">${p.av}</span><span class="n ${al?'':'dead'}">${esc(p.name)}<small>${roleTxt(id)}${al?'':' • 💀'}</small></span></div>`}).join('')}</div>
 <h3>🏆 نقاط المافيا</h3>${sBoard('mafia')}
 <button class="btn big primary" data-a="go" data-v="mafSetup">🔁 لعبة جديدة</button>
 <button class="btn pink" data-a="wheelFor" data-v="">🎡 دولاب العقاب للخسرانين</button>`};
M.mafEnd=()=>{sfx('win');confetti(160,MF().win==='mafia'?['🔪','😈']:['😇','🎉'])};

const letCats=()=>LET_BASE.concat(LT().extra);
V.letSetup=()=>{const L=LT();return `<h2>🔤 اسم حيوان نبات جماد بلاد</h2>
 <div class="card"><p>كل واحد ياخذ ورقة وقلم ✍️ الحظ يختار حرف، وانتو تكتبون كلمة تبدي بيه لكل خانة قبل لا يخلص الوقت!</p></div>
 <div class="card opt"><label>📋 الخانات</label><div class="chips">${LET_BASE.map(c=>`<span class="chip on">${c}</span>`).join('')}${LET_EXTRA.map(c=>`<button class="chip ${L.extra.includes(c)?'on':''}" data-a="letX" data-v="${c}">${c}</button>`).join('')}</div><small>الخانات الإضافية اختيارية، اضغط عليها حتى تضيفها</small></div>
 <div class="card opt"><label>⏱️ الوقت</label><div class="seg">${[60,90,120,180].map(t=>`<button class="${L.time===t?'on':''}" data-a="letTime" data-v="${t}">${t}ث</button>`).join('')}</div></div>
 <div class="card"><div class="toggle"><span>😈 حروف صعبة (ث ذ ض ظ غ)</span><button class="sw ${L.hard?'on':''}" data-a="letHard"></button></div></div>
 <button class="btn big primary" data-a="letRoll">🎲 اختار الحرف</button>`};

A.letTime=v=>{LT().time=+v;render()};

A.letRoll=()=>{const L=LT();const pool=LETTERS.concat(L.hard?HARD_LETTERS:[]);let fresh=pool.filter(x=>!L.used.includes(x));if(!fresh.length){L.used=[];fresh=pool}
 L.letter=rnd(fresh);L.used.push(L.letter);L.pts={};L.saved=false;go('letRoll')};
V.letRoll=()=>`<h2>🎲 الحرف هو...</h2><div class="bigletter" id="bl">؟</div><div id="lrInfo" style="display:flex;flex-direction:column;gap:12px"></div>`;
M.letRoll=()=>{const L=LT();const el=$('#bl');const pool=LETTERS.concat(L.hard?HARD_LETTERS:[]);const iv=I(()=>{el.textContent=rnd(pool);sfx('tick')},85);
 T(()=>{clearInterval(iv);el.textContent=L.letter;el.classList.add('stop');sfx('win');vib(100);confetti(50,[L.letter]);
  $('#lrInfo').innerHTML=`<div class="chips cc">${letCats().map(c=>`<span class="chip on">${c}</span>`).join('')}</div><button class="btn big primary" data-a="go" data-v="letPlay">⏱️ ابدأ الوقت (${L.time} ثانية)</button>`},1800)};
V.letPlay=()=>{const L=LT();return `<div class="bigletter small stop">${L.letter}</div><div class="chips cc">${letCats().map(c=>`<span class="chip on">${c}</span>`).join('')}</div>${ringH(L.time)}
 <p class="center muted">اكتبوا بسرعة! أول واحد يخلص يصيح "ستوب!" 🛑</p><button class="btn big red" data-a="letStop">🛑 ستوب!</button>`};

 if(L.saved)return `<h2>🏆 النتائج بعد ${L.round} ${L.round>1?'جولات':'جولة'}</h2>${sBoard('letters',L.pts)}<button class="btn big primary" data-a="letRoll">🎲 حرف جديد</button><button class="btn small" data-a="go" data-v="letSetup">⚙️ غيّر الخانات والوقت</button>`;
 return `<h2>✍️ احسبوا النقاط</h2><div class="card"><p class="muted" style="font-size:14px">الحرف: <b style="color:var(--pri);font-size:20px">${L.letter}</b> • لكل خانة: <b>١٠</b> إذا محد كتب نفس الكلمة، <b>٥</b> إذا مكررة، <b>٠</b> إذا فارغة أو غلط.</p></div>
 <div class="plist">${players.map(p=>`<div class="pitem"><span class="av" style="cursor:default">${p.av}</span><span class="pname">${esc(p.name)}</span><div class="stepper sm"><button data-a="letPt" data-v="${p.id}|-5">−</button><b>${L.pts[p.id]||0}</b><button data-a="letPt" data-v="${p.id}|5">+</button></div></div>`).join('')}</div>
 <button class="btn big primary" data-a="letSave">💾 احفظ النقاط</button>`};
A.letPt=(v,el)=>{const [id,d]=v.split('|');const L=LT();L.pts[id]=Math.max(0,(L.pts[id]||0)+(+d));const b=el.parentNode.querySelector('b');if(b)b.textContent=L.pts[id]};

/* ============================ CLOSEST ============================ */

 Object.assign(C,{q:q[0],ans:q[1],unit:q[2],g:{},order:shuffle(players.map(p=>p.id)),idx:0,ready:false,shown:false,pts:{}})}
V.clsQ=()=>{const C=TMP.cls;return `<div class="card bigcard"><span style="font-size:60px">🤔</span><span>${esc(C.q)}</span><small class="muted">الجواب بالـ${esc(C.unit)}</small></div>
 <p class="center muted">كل واحد يكتب تخمينه بالسر، والأقرب للجواب يفوز! 🏆</p>
 <button class="btn big primary" data-a="clsStart">✍️ يلا نخمّن</button><button class="btn small ghost" data-a="clsSkip">🔀 سؤال ثاني</button>`};
A.clsSkip=()=>{clsNew();render()};
A.clsStart=()=>{const C=TMP.cls;C.order=shuffle(players.map(p=>p.id));C.idx=0;C.ready=false;C.g={};go('clsGuess')};

function buildRound(){

 let pool=all.filter(c=>(selCats||all.map(x=>x.id)).includes(c.id));

 if(settings.twists)twist=wpick(TWISTS.filter(t=>(!t.classic||mode==='classic')&&(!t.min||players.length>=t.min)));
 if(twist.id==='two')k=Math.max(k,2);

 const cat=rnd(pool);let fresh=cat.words.filter(w=>!recentWords.includes(cat.id+':'+w));if(!fresh.length)fresh=cat.words;
 const word=rnd(fresh);recentWords=[cat.id+':'+word].concat(recentWords).slice(0,120);
 const decoy=rnd(cat.words.filter(w=>w!==word))||word;
 const outsiders=shuffle(players.map(p=>p.id)).slice(0,k);
 const q=[];for(let r=0;r<settings.qRounds;r++){const o=shuffle(players.map(p=>p.id));o.forEach((id,i)=>q.push([id,o[(i+1)%o.length]]))}
 R={cat,word,decoy,outsiders,mode,twist,timer:twist.id==='speed'?15:settings.timer,showCat:twist.id==='blind'?false:settings.showCat,
  order:shuffle(players.map(p=>p.id)),ri:0,shown:false,q,qi:0,votes:{},voters:shuffle(players.map(p=>p.id)),vi:0,vready:false,opts:{},gres:{},gpick:{},gi:0};
 save();return true}
A.flipCard=()=>{if(R.shown)return;R.shown=true;sfx('flip');vib(40);render()};
A.nextReveal=()=>{R.shown=false;R.ri++;if(R.ri>=R.order.length)go('qintro');else render()};
A.newHint=()=>{const h=$('#qh');if(h)h.textContent=rnd(Q_HINTS)};
A.nextQ=()=>{R.qi++;if(R.qi>=R.q.length)go('qend');else go('questions')};
A.moreQ=()=>{const o=shuffle(players.map(p=>p.id));o.forEach((id,i)=>R.q.push([id,o[(i+1)%o.length]]));go('questions')};
A.startVote=()=>{R.votes={};R.vi=0;R.vready=false;go('vote')};
A.voteReady=()=>{R.vready=true;render()};
A.castVote=id=>{const v=R.voters[R.vi];R.votes[v]=id;sfx('pop');vib(30);R.vi++;R.vready=false;if(R.vi>=R.voters.length)tallyVotes();else render()};
A.groupVote=id=>{players.forEach(p=>{if(p.id!==id)R.votes[p.id]=id});tallyVotes()};
function tallyVotes(){const t={};Object.values(R.votes).forEach(id=>t[id]=(t[id]||0)+1);R.tally=t;const max=Math.max(0,...Object.values(t));const tops=Object.keys(t).filter(id=>t[id]===max);
 R.accused=(tops.length===1&&max>0)?tops[0]:null;R.caught=R.accused&&R.outsiders.includes(R.accused)?[R.accused]:[];R.vrShown=false;go('voteRes')}
A.startGuess=()=>{R.outsiders.forEach(id=>{const others=shuffle(R.cat.words.filter(w=>w!==R.word)).slice(0,11);R.opts[id]=shuffle(others.concat(R.word))});R.gi=0;go('guess')};
A.pickGuess=w=>{const id=R.outsiders[R.gi];if(R.gres[id]!==undefined)return;const ok=w===R.word;R.gres[id]=ok;R.gpick[id]=w;if(ok){sfx('win');confetti(100,['🧠','🦊','✨'])}else{sfx('fail');vib([100,50,100])}render()};
A.afterGuess=()=>{R.gi++;if(R.gi<R.outsiders.length)render();else{scoreRound();go('results')}};
function scoreRound(){if(R.scored)return;R.scored=true;const pts={};players.forEach(p=>pts[p.id]=0);
 const before={};players.forEach(p=>before[p.id]=rankOf(p.score));const mult=R.twist.id==='double'?2:1;const esc3=R.twist.id==='jackpot'?6:3;
 Object.entries(R.votes).forEach(([v,t])=>{if(!R.outsiders.includes(v)&&R.outsiders.includes(t)){pts[v]+=2;const p=pById(v);if(p)p.st.votes++}});
 R.outsiders.forEach(id=>{const p=pById(id);if(!p)return;p.st.out++;if(R.caught.includes(id)){p.st.caught++;gstats.caught++}else{pts[id]+=esc3;p.st.escaped++;gstats.escaped++}if(R.gres[id]){pts[id]+=2;p.st.guessed++;gstats.guessed++}});
 players.forEach(p=>{pts[p.id]*=mult;p.score+=pts[p.id];match.pts[p.id]=(match.pts[p.id]||0)+pts[p.id]});R.pts=pts;gstats.rounds++;
 match.round++;if(match.len&&match.round>=match.len)match.done=true;
 R.levelUps=players.filter(p=>rankOf(p.score)!==before[p.id]).map(p=>[p.id,rankOf(p.score)]);
 const minPts=Math.min(...players.map(p=>pts[p.id]));const losers=players.filter(p=>pts[p.id]===minPts);
 const caughtOut=R.caught.length?R.caught[0]:null;R.loser=caughtOut||rnd(losers).id;save()}

/* side game actions */
A.wheelFor=id=>{TMP.victim=id||null;go('wheel')};
A.spin=()=>{if(TMP.spinning)return;TMP.spinning=true;const b=$('#spinBtn');if(b)b.disabled=true;$('#whres').innerHTML='';
 const n=PENALTIES.length,seg=Math.PI*2/n,target=Math.floor(Math.random()*n);const r0=TMP.rot;const base=-Math.PI/2-(target+.5)*seg+(Math.random()-.5)*seg*.6;
 const rf=base+Math.PI*2*Math.ceil((r0+Math.PI*12-base)/(Math.PI*2));const dur=4800,t0=performance.now();let lastSeg=-1;
 const step=now=>{const k=Math.min(1,(now-t0)/dur);const e=1-Math.pow(1-k,4);const rot=r0+(rf-r0)*e;TMP.rot=rot;drawWheel(rot);
  const cur=Math.floor((((-Math.PI/2-rot)%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/seg);if(cur!==lastSeg){lastSeg=cur;sfx('tick')}
  if(k<1)raf=requestAnimationFrame(step);else{TMP.spinning=false;if(b)b.disabled=false;const p=PENALTIES[target];
   if(p.s==='نجوت!'){sfx('win');confetti(100,['🍀','😅'])}else{sfx('honk');confetti(60,['😈','😂'])}vib(200);
   $('#whres').innerHTML=`<div class="card bigcard" style="min-height:120px;animation:pop .5s"><span style="font-size:60px">${p.e}</span><span>${esc(p.t)}</span></div>`}};
 raf=requestAnimationFrame(step)};
A.surprise=()=>{const opts=GAMES.filter(g=>players.length>=g.min).map(g=>g.id);if(players.length>=3)opts.push('baraa','baraa');const pick=rnd(opts);
 if(pick==='baraa'){toast('🎲 الحظ اختار: برّا السالفة!');A.start();return}
 const g=GAMES.find(x=>x.id===pick);toast(`🎲 الحظ اختار: ${g.e} ${g.n}`);
 if(pick==='wheel'){TMP.victim=players.length?rnd(players).id:null;go('wheel');T(()=>A.spin(),900);return}
 if(pick==='likely')TMP.lq=rnd(MOST_LIKELY);
 if(pick==='td'){TMP.tdP=players.length?rnd(players).id:null;TMP.tdText=null}
 startGame(g)};
A.likelyNext=()=>{TMP.lq=rnd(MOST_LIKELY.filter(q=>q!==TMP.lq));render()};
A.likelyGo=()=>{const b=$('#lgo');if(b.disabled)return;b.disabled=true;const c=$('#lcount');let n=3;const show=()=>{c.innerHTML=`<div class="count">${n||'👉'}</div>`;if(n){sfx('tick')}else{sfx('honk');vib(200);c.innerHTML+=`<p class="center" style="font-weight:800;font-size:22px">أشروا هسّه!</p>`;b.disabled=false}n--};show();const iv=I(()=>{if(n<0){clearInterval(iv);return}show()},800)};
A.chCat=v=>{TMP.chCat=v;render()};
A.chTime=v=>{TMP.chTime=+v;render()};
A.chStart=()=>{const cats=allCats();const words=TMP.chCat==='mix'?cats.flatMap(c=>c.words):(cats.find(c=>c.id===TMP.chCat)||cats[0]).words;
 const q=shuffle(words);TMP.ch={all:words,q,cur:q.pop(),ok:[],skip:[],left:TMP.chTime,total:TMP.chTime};sfx('pop');go('charPlay')};
function chNext(){const ch=TMP.ch;if(!ch.q.length)ch.q=shuffle(ch.all.filter(w=>!ch.ok.includes(w)&&w!==ch.cur));if(!ch.q.length)ch.q=['خلصت الكلمات 😅'];ch.cur=ch.q.pop();const w=$('#chw');if(w){w.textContent=ch.cur;w.style.animation='none';w.offsetHeight;w.style.animation='pop .3s'}const pl=document.querySelector('.s-charPlay .pill');if(pl)pl.textContent='✅ '+ch.ok.length}
A.chOk=()=>{TMP.ch.ok.push(TMP.ch.cur);sfx('win');vib(40);chNext()};
A.chSkip=()=>{TMP.ch.skip.push(TMP.ch.cur);sfx('boing');chNext()};
A.tdPick=()=>{if(!players.length)return;TMP.tdP=rnd(players.filter(p=>p.id!==TMP.tdP))?.id||players[0].id;TMP.tdText=null;sfx('boing');render()};
A.tdGo=t=>{TMP.tdType=t;TMP.tdText=rnd(t==='t'?TRUTHS:DARES);sfx(t==='t'?'pop':'honk');render()};

A.sw=k=>{settings[k]=!settings[k];save();render()};
A.setOpt=v=>{const [k,val]=v.split('|');settings[k]=isNaN(+val)?val:+val;save();render()};
A.wipe=()=>modal(`<h3 class="center">⚠️ متأكد؟</h3><p class="center muted">راح ينمسح كل شي: اللاعبين، النقاط، الفئات الخاصة</p><div class="row"><button class="btn red" data-a="confirmWipe">امسح</button><button class="btn" data-a="closeModal">لا</button></div>`);
A.confirmWipe=()=>{players=[];customCats=[];selCats=null;gstats={rounds:0,caught:0,escaped:0,guessed:0,games:0};settings=Object.assign({},DEF_SETTINGS);match=null;recentWords=[];save();toast('انمسح كل شي 🧹');go('home')};

let wakeLock=null;function keepAwake(){try{if(navigator.wakeLock&&!wakeLock)navigator.wakeLock.request('screen').then(l=>{wakeLock=l;l.addEventListener('release',()=>{wakeLock=null})}).catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a;if(!A[a])return;keepAwake();
 if(performance.now()-lastRender<380&&!el.closest('#ov')&&!['toggleSound','home','letPt','drawCol','drawSize','drawClear','chOk','chSkip','newHint'].includes(a))return;
 if(!['spin','toggleSound','addPlayer','cycleAv','flipCard','castVote','pickGuess','chOk','chSkip','tdGo','tdPick','likelyGo','letPt','drawCol','mafAct','frHot','frGuess','drawWin','clsSubmit'].includes(a))sfx('click');A[a](el.dataset.v,el)});

render();
cloudLoad();
</script>
